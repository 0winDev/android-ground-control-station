name: Bug
description: Something behaves differently from what the requirements say.
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happens
      description: Observed behavior. Paste logs or stack traces as text.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What should happen
      description: Expected behavior, ideally citing the REQ-xxx it violates.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Include the SITL setup (vehicle, parameters, connection) or the .tlog if relevant.
      value: |
        1.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: App commit/version, device + Android version, ArduPilot SITL version
    validations:
      required: true
  - type: dropdown
    id: safety
    attributes:
      label: Safety impact
      description: Could this make the operator or the vehicle unsafe (wrong state shown, command sent unintentionally, failsafe not reported)?
      options:
        - "No"
        - "Yes"
        - Not sure
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: Notes
      description: Hypotheses, related issues.
