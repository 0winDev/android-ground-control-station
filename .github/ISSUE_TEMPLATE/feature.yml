name: Feature
description: A unit of work inside a roadmap phase.
labels: ["enhancement"]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What is the problem or need, and why now?
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance criteria
      description: Verifiable outcomes, as checkboxes.
      value: |
        - [ ]
    validations:
      required: true
  - type: input
    id: requirements
    attributes:
      label: Requirements covered
      description: REQ-xxx IDs from docs/requirements.md (add missing ones in the same PR).
      placeholder: REQ-010, REQ-011
    validations:
      required: true
  - type: input
    id: phase
    attributes:
      label: Roadmap phase
      placeholder: v0.1 Connection
    validations:
      required: true
  - type: textarea
    id: done-when
    attributes:
      label: Phase "done when"
      description: The phase's done-when criterion, copied from the roadmap.
    validations:
      required: true
  - type: textarea
    id: pitfalls
    attributes:
      label: Known pitfalls
      description: Protocol traps, ArduPilot quirks, safety concerns, lessons from earlier issues.
  - type: checkboxes
    id: flags
    attributes:
      label: Flags
      options:
        - label: Touches the MAVLink codec (`codec-review`, test-first, line-by-line owner review)
        - label: Touches failsafe, commands, missions or signing (needs `safety-reviewer`)
        - label: Touches protocol, telemetry or commands (needs SITL + QGroundControl check)
