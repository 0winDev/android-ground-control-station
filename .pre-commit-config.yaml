# Git hooks for GCS, run by the pre-commit framework (https://pre-commit.com).
# Install once per clone: `pre-commit install` (installs both hook types below).
# Hook versions are pinned with `pre-commit autoupdate`, never edited by hand.
minimum_pre_commit_version: "4.4.0"
default_install_hook_types: [pre-commit, commit-msg]
# File checks run once, at pre-commit; only the message hooks below opt into commit-msg.
default_stages: [pre-commit]

repos:
  # Repository hygiene.
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      # Third-party texts (license files) stay byte-for-byte as published.
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
        exclude: ^(LICENSE$|core/designsystem/src/main/assets/licenses/)
      - id: end-of-file-fixer
        exclude: ^(LICENSE$|core/designsystem/src/main/assets/licenses/)
      - id: check-yaml
      - id: check-merge-conflict
      - id: check-added-large-files
        # SITL captures (.tlog excerpts, raw frames) used as test fixtures can be big; keep them under 2 MB.
        args: [--maxkb=2048]

  # Secrets (e.g. the MAVLink signing key) must never reach the repository.
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.0
    hooks:
      - id: gitleaks

  # Commit messages: Conventional Commits with exactly the types in CONTRIBUTING.md.
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: v4.4.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [feat, fix, refactor, test, docs, build, ci, chore]

  - repo: local
    hooks:
      # The subject must end with the issue number, e.g. "feat: parse HEARTBEAT message (#12)".
      # Merge and revert commits generated by git are allowed as they are.
      - id: issue-number
        name: Commit subject references an issue (#n)
        language: pygrep
        entry: '\A(?:(?:Merge|Revert)\b|[^\n]*\(#[0-9]+\)[ \t]*(?:\n|\Z))'
        args: [--multiline, --negate]
        stages: [commit-msg]

      # Gradle checks: formatting first, then static analysis and module rules.
      # The entry is what ./gradlew itself runs (`java -jar gradle/wrapper/gradle-wrapper.jar`): pre-commit
      # cannot execute ./gradlew on Windows because of its `#!/bin/sh` shebang, and gradlew.bat/cmd.exe
      # would break macOS and Linux. Same wrapper, same Gradle version, on every OS; needs `java` on PATH.
      - id: ktlint
        name: ktlint (format, then check)
        language: unsupported
        entry: java -jar gradle/wrapper/gradle-wrapper.jar ktlintFormat ktlintCheck --quiet
        types_or: [kotlin]
        pass_filenames: false
        require_serial: true

      - id: detekt
        name: detekt and module graph
        language: unsupported
        entry: java -jar gradle/wrapper/gradle-wrapper.jar detekt verifyModuleGraph --quiet
        types_or: [kotlin]
        pass_filenames: false
        require_serial: true
